<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cuey Screen</title>
<link rel="icon" href="../favicon.png">
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Poppins,system-ui,sans-serif;overflow:hidden}
.ly{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .6s}
.ly.on{opacity:1}
.ly img{width:100%;height:100%;object-fit:contain}
.ly video{max-width:100%;max-height:100%}
#black{position:fixed;inset:0;background:#000;opacity:0;transition:opacity .4s;pointer-events:none}
#black.on{opacity:1}
#wait{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0A0A0C;text-align:center;padding:24px;transition:opacity .5s}
#wait.off{opacity:0;pointer-events:none}
#wait img{width:200px}
#wait .lbl{font:11px ui-monospace,monospace;letter-spacing:2px;color:#555;margin-top:18px}
#wait .code{font:600 22px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.14em;color:#8a8a93;margin-top:4px}
#wait .tip{font-size:13px;color:#666;margin-top:6px}
#st{width:10px;height:10px;border-radius:50%;background:#333;top:14px;right:14px;opacity:.9!important;font-size:0}
#st.ok{background:#C8FF00}#st.warn{background:#FF751F}
#wait p{margin:0;color:#8a8a93;font-size:15px;max-width:420px}
#wait .dot{width:10px;height:10px;border-radius:50%;background:#FF751F;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.3}}
#st{position:fixed;top:12px;right:14px;font:12px ui-monospace,monospace;color:#555;opacity:0;transition:opacity .3s}
body:hover #st{opacity:1}
#fs{position:fixed;bottom:16px;right:16px;padding:10px 14px;border-radius:10px;border:1px solid #333;background:#111;color:#ddd;font:14px Poppins,system-ui;cursor:pointer;opacity:.9}
</style>
</head>
<body>
<div class="ly" id="a"></div><div class="ly" id="b"></div>
<video id="rtc" autoplay playsinline muted style="position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none"></video>
<button id="snd" style="display:none;z-index:5;position:fixed;bottom:16px;left:16px;padding:10px 14px;border-radius:10px;border:1px solid #333;background:#111;color:#ddd;font:14px Poppins,system-ui;cursor:pointer;opacity:.9">🔇 Sound off — click to unmute</button>
<div id="web" style="position:fixed;inset:0;display:none;background:#000"><div id="ytp" style="width:100%;height:100%"></div></div>
<div id="black"></div>
<div id="wait">
  <img src="../logo-full.png" alt="Cuey">
  <div class="dot"></div>
  <p id="msg">Looking for the show…</p>
  <p>Keep this window on the projector. The phone or computer does the rest.</p>
  <div class="lbl">SHOW CODE</div>
  <div class="code" id="code"></div>
  <p class="tip" id="tip"></p>
  <button id="fs">⛶ Fullscreen</button>
</div>
<div id="st"></div>
<script>
const code=(new URLSearchParams(location.search).get('c')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,32);
document.getElementById('code').textContent=code?'CUEY-'+(code.match(/.{1,4}/g)||[]).join('-'):'';
if(!code){document.getElementById('msg').textContent='This link has no show code — ask for it again.'}
function setSt(k,txt){st.className=k;st.title=txt||''}
const cues={};let live=-1,cur='a',shown=null,n=0,lastTs=0;
const L={a:document.getElementById('a'),b:document.getElementById('b')};
function show(i,trans){const c=cues[i];if(!c)return;const nxt=cur==='a'?'b':'a';const el=L[nxt];el.innerHTML='';
  const im=new Image();im.src=c.t;el.appendChild(im);
  const old=L[cur];if(trans==='cut'){old.style.transition='none';el.style.transition='none'}else{old.style.transition='';el.style.transition=''}
  el.classList.add('on');old.classList.remove('on');cur=nxt;shown=i}
function setBlack(b){document.getElementById('black').classList.toggle('on',!!b)}
document.getElementById('fs').onclick=()=>document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
document.addEventListener('dblclick',()=>document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen());
const st=document.getElementById('st'),msg=document.getElementById('msg');
/* ---- live stream from the Cuey app (WebRTC) ---- */
const myId=Math.random().toString(36).slice(2,10);let pc=null,rtcOn=false,helloT=0;
const rtc=document.getElementById('rtc'),snd=document.getElementById('snd');
function post(o){return fetch('https://ntfy.sh/cuey-v1-'+code,{method:'POST',body:JSON.stringify(o)}).catch(()=>{})}
async function body(d){if(d.attachment&&d.attachment.url){try{return await (await fetch(d.attachment.url)).text()}catch(e){return ''}}return d.message||''}
function hello(){if(!rtcOn)post({t:'hello',id:myId})}
function waitIce(p){return new Promise(r=>{if(p.iceGatheringState==='complete')return r();const f=()=>{if(p.iceGatheringState==='complete'){p.removeEventListener('icegatheringstatechange',f);r()}};p.addEventListener('icegatheringstatechange',f);setTimeout(r,2500)})}
async function onOffer(m){
  if(pc){try{pc.close()}catch(e){}}
  pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  pc.ontrack=e=>{rtc.srcObject=e.streams[0];rtc.style.display='block';snd.style.display='block';rtcOn=true;document.getElementById('wait').classList.add('off');rtc.play().catch(()=>{})};
  pc.onconnectionstatechange=()=>{const c=pc.connectionState;setSt(c==='connected'?'ok':'warn',c);if(['failed','disconnected','closed'].includes(c)){rtcOn=false;rtc.style.display='none';snd.style.display='none';document.getElementById('wait').classList.remove('off');msg.textContent='Lost the link for a moment — reconnecting…';document.getElementById('tip').textContent='Tip: both devices on the same Wi‑Fi works best.';setTimeout(hello,1500)}};
  await pc.setRemoteDescription({type:'offer',sdp:m.sdp});const ans=await pc.createAnswer();await pc.setLocalDescription(ans);await waitIce(pc);
  post({t:'answer',id:myId,sdp:pc.localDescription.sdp});
}
snd.onclick=()=>{rtc.muted=!rtc.muted;snd.textContent=rtc.muted?'🔇 Sound off — click to unmute':'🔊 Sound on';webSync()};
/* ---- online videos (YouTube / Vimeo): the Cuey app can't send their picture, so this page plays the same video, in time ---- */
const webBox=document.getElementById('web');let web=null,yt=null,ytReady=false,vmF=null,ytApi=null;
function loadYtApi(){if(ytApi)return ytApi;ytApi=new Promise(r=>{window.onYouTubeIframeAPIReady=r;const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s)});return ytApi}
function webOff(){web=null;webBox.style.display='none';if(yt){try{yt.destroy()}catch(e){}yt=null;ytReady=false;webBox.innerHTML='<div id="ytp" style="width:100%;height:100%"></div>'}if(vmF){vmF.remove();vmF=null}}
function webTarget(){return web?web.at+(web.playing?(performance.now()-web.rx)/1000:0):0}
function vm(method,value){if(vmF)vmF.contentWindow.postMessage(JSON.stringify(value===undefined?{method}:{method,value}),'*')}
async function onWeb(m){
  if(!m.on){webOff();return}
  const key=m.p+':'+m.id,fresh=!web||web.key!==key;
  if(fresh){webOff()}
  web={...m,key,rx:performance.now()};webBox.style.display='block';document.getElementById('wait').classList.add('off');
  if(fresh&&m.p==='yt'){await loadYtApi();if(!web||web.key!==key)return;
    yt=new YT.Player('ytp',{host:'https://www.youtube-nocookie.com',videoId:m.id,playerVars:{autoplay:1,controls:0,rel:0,modestbranding:1,playsinline:1,iv_load_policy:3,disablekb:1,fs:0,mute:1,start:Math.floor(webTarget())},
      events:{onReady:()=>{ytReady=true;webSync(true)}}})}
  else if(fresh&&m.p==='vm'){vmF=document.createElement('iframe');vmF.allow='autoplay; fullscreen';vmF.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:0';
    vmF.src='https://player.vimeo.com/video/'+m.id+'?'+(m.h?'h='+m.h+'&':'')+'autoplay=1&muted=1&controls=0&title=0&byline=0&portrait=0#t='+Math.floor(webTarget())+'s';webBox.appendChild(vmF);vmF.onload=()=>webSync(true)}
  else webSync(true)}
function webSync(seek){if(!web)return;const t=webTarget(),mute=rtc.muted||!web.snd;
  if(yt&&ytReady){try{const c=yt.getCurrentTime();if(seek||Math.abs(c-t)>1.5)yt.seekTo(t,true);web.playing?yt.playVideo():yt.pauseVideo();mute?yt.mute():(yt.unMute(),yt.setVolume(Math.round((web.vol??1)*100)))}catch(e){}}
  if(vmF){if(seek)vm('setCurrentTime',t);vm(web.playing?'play':'pause');vm('setVolume',mute?0:(web.vol??1))}}
setInterval(()=>{if(yt&&ytReady)webSync(false)},2000);
setInterval(()=>{if(!rtcOn&&code)hello()},20000);
function handle(d){
  if(d.event!=='message')return;
  const m=d.message||'';
  if(d.attachment&&m.startsWith('cue:')){const i=+m.split(':')[1];cues[i]={t:d.attachment.url};if(live===i&&shown!==i)show(i,'cut');return}
  let s;try{s=JSON.parse(m)}catch(e){return}
  if(s.t!=='state'||s.ts<lastTs)return;lastTs=s.ts;n=s.n;
  if(s.live>=0)document.getElementById('wait').classList.add('off');else{document.getElementById('wait').classList.remove('off');msg.textContent='Ready — press GO.'}
  if(s.live!==live||shown!==s.live){live=s.live;if(live>=0&&cues[live])show(live,s.trans||'dissolve')}
  setBlack(s.black)}
function connect(){const ws=new WebSocket('wss://ntfy.sh/cuey-v1-'+code+'/ws?since=6h');
  ws.onopen=()=>{setSt('ok','connected');if(live<0)msg.textContent='Ready — waiting for the show to start…';hello()};
  ws.onmessage=async e=>{let d;try{d=JSON.parse(e.data)}catch(x){return}if(d.event!=='message')return;let m=null;try{m=JSON.parse(await body(d))}catch(x){}
    if(m&&m.t==='offer'&&m.to===myId){onOffer(m);return}
    if(m&&m.t==='bye'&&m.host){if(pc){try{pc.close()}catch(x){}}webOff();return}
    if(m&&m.t==='web'){onWeb(m);return}
    if(m&&m.t==='full'&&m.to===myId){rtcOn=true;msg.textContent='This show is already shared to one screen (free plan). The organiser can share to more screens with Cuey Studio.';return}
    handle(d)};
  ws.onclose=()=>{setSt('warn','reconnecting');setTimeout(connect,2000)};ws.onerror=()=>setSt('warn','error')}
if(code)connect();
</script>
</body>
</html>
