<!doctype html><html><head><meta charset="utf-8"><title>Cuey player</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{width:100%;height:100%;border:0;display:block;pointer-events:none}</style></head><body>
<script>
// Cuey online-cue relay: YouTube / Vimeo players need a real page address (the Output window has none),
// so Cuey loads this tiny page, which hosts the official player and passes messages both ways.
(function(){
  var src=new URLSearchParams(location.hash.slice(1)).get('src')||'';
  if(!/^https:\/\/(www\.youtube-nocookie\.com\/embed\/|player\.vimeo\.com\/video\/)/.test(src))return;
  var f=document.createElement('iframe');f.allow='autoplay; encrypted-media; fullscreen; picture-in-picture';f.src=src;document.body.appendChild(f);
  addEventListener('message',function(e){
    if(e.source===f.contentWindow)parent.postMessage(e.data,'*');
    else if(e.source===parent)try{f.contentWindow.postMessage(e.data,'*')}catch(x){}
  });
})();
</script></body></html>
