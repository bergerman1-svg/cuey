name: Mac notary status
# Asks Apple where our notarization submissions stand. Publishes nothing. Run by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: macos-latest
    steps:
      - env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" 2>&1 | grep -E "id:|status:|createdDate:|name:|Error|error" | head -40
