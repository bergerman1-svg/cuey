name: Build & Release
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # release gate (Ron, approved by Avi 29.10.2026): every test must pass before a version is built
  tests:
    runs-on: ubuntu-24.04   # pinned: Playwright's browser dependencies don't install on the new Ubuntu 26 image yet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright==1.56.0 && python -m playwright install --with-deps chromium
      - run: mkdir -p /tmp/gate && cd /tmp/gate && python "$GITHUB_WORKSPACE/tests/run_all.py"
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: gate-screens, path: /tmp/gate/*.png, if-no-files-found: ignore }

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "new=false" >> $GITHUB_OUTPUT; else echo "new=true" >> $GITHUB_OUTPUT; fi

  build:
    needs: [version, tests]
    if: needs.version.outputs.new == 'true'
    strategy:
      matrix:
        include:
          - os: macos-latest
            cmd: npm run dist:mac
          - os: windows-latest
            cmd: npm run dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: ${{ matrix.cmd }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned builds until certificates are added
      - uses: actions/upload-artifact@v4
        with:
          name: cuey-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Cuey ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/**/*.dmg
            dist/**/*.exe
          generate_release_notes: true
